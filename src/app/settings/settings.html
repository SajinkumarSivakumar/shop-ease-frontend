<div class="w-full bg-gradient-to-br from-slate-50 to-blue-50 rounded-3xl shadow-xl border border-white/50 overflow-hidden">

    <!-- Header -->
    <div class="relative px-8 py-7 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600">

        <div class="absolute top-0 right-0 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>

        <div class="relative z-10 flex items-center gap-4">

            <div
                    class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-md flex items-center justify-center text-3xl shadow-lg border border-white/20">
                ⚙️
            </div>

            <div>
                <h2 class="text-3xl font-bold text-white tracking-wide">
                    Settings
                </h2>

                <p class="text-blue-100 text-sm mt-1">
                    Manage your account settings and user roles
                </p>
            </div>

        </div>

    </div>

    <!-- Body -->
    <form [formGroup]="settings" class="p-8">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Email Card -->
            <div
                    class="group bg-white/80 backdrop-blur-lg border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-xl transition-all duration-300">

                <label class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    <span class="text-lg">📧</span>
                    Select Email
                </label>

                <mat-form-field appearance="outline" class="w-full modern-field">

                    <mat-select formControlName="email">

                        <mat-option>
                            <ngx-mat-select-search
                                    formControlName="emailCtrl"
                                    placeholderLabel="Search email..."
                                    noEntriesFoundLabel="No email found">
                            </ngx-mat-select-search>
                        </mat-option>

                        <mat-option *ngFor="let c of users"
                                    [value]="c.id">
                            {{ c.email }}
                        </mat-option>

                    </mat-select>

                </mat-form-field>

            </div>

            <!-- Role Card -->
            <div
                    class="group bg-white/80 backdrop-blur-lg border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-xl transition-all duration-300">

                <label class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    <span class="text-lg">🛡️</span>
                    User Role
                </label>

                <div class="relative">

                    <select
                            formControlName="role"
                            class="w-full h-14 rounded-xl border border-slate-300 bg-gradient-to-r from-white to-slate-50
                     px-4 text-slate-700 font-medium shadow-sm
                     focus:outline-none focus:ring-4 focus:ring-blue-200
                     focus:border-blue-500 transition-all duration-300">

                        <option value="admin">👑 Admin</option>
                        <option value="user">🙋 User</option>

                    </select>

                </div>

            </div>

        </div>

        <!-- Bottom Action -->
        <div class="flex justify-end mt-8">

            <button (click)="saveSettings()"
                    class="px-8 py-3 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600
                   text-white font-semibold shadow-lg hover:scale-105
                   hover:shadow-2xl transition-all duration-300">

                Save Settings

            </button>

        </div>

    </form>

</div>
