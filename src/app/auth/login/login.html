<div
        class="min-h-screen flex items-center justify-center bg-cover bg-center"
        style="
    background-image: linear-gradient(rgba(10,10,10,0.75), rgba(10,10,10,0.85)),
    url('https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a');
  "
>
    <form [formGroup]="loginForm" (ngSubmit)="login()" class="backdrop-blur-xl bg-white/10 border border-white/20 p-10 w-[360px] rounded-2xl shadow-2xl text-white animate-fadeIn">



        <div class="text-center">
            <div class="text-4xl mb-2">🛍️</div>
            <h2 class="text-2xl font-bold tracking-wide">ShopEase</h2>
            <h3 class="mt-2 font-normal">Welcome Back</h3>
            <p class="text-sm text-gray-300 mb-5">
                Sign in to continue shopping
            </p>
        </div>

        <!-- Email -->
        <input
                type="email"
                formControlName="email"
                placeholder="Email Address"
                class="w-full p-3 mb-4 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-pink-500"
        />

        <div
                class="text-xs text-red-300 text-left -mt-2 mb-2"
                *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        >
            Enter valid email
        </div>

        <!-- Password -->
        <div class="relative">
            <input
                    [type]="showPassword ? 'text' : 'password'"
                    formControlName="password"
                    placeholder="Password"
                    class="w-full p-3 mb-4 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-pink-500"
            />

            <span
                    class="absolute right-3 top-3 cursor-pointer"
                    (click)="togglePassword()"
            >
        {{ showPassword ? '🙈' : '👁' }}
      </span>
        </div>

        <div
                class="text-xs text-red-300 text-left -mt-2 mb-2"
                *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        >
            Password required
        </div>

        <!-- Button -->
        <button
                type="submit"
                [disabled]="isLoading"
                class="w-full p-3 bg-gradient-to-r from-pink-500 to-orange-400 rounded-lg font-bold hover:scale-105 transition"
        >
            {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </button>


        <p class="text-xs text-gray-400 mt-2">🔒 Secure Login</p>


        <div class="mt-3 text-sm">
            Don't have an account?
            <a href="register" class="text-orange-400 font-bold">Register</a>
        </div>
    </form>
</div>
