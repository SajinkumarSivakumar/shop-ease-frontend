<div>
    <app-common></app-common>
</div>

<div class="min-h-screen flex items-center justify-center bg-cover bg-center
            bg-[url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1920&auto=format&fit=crop')]">

    <!-- overlay -->
    <div class="absolute inset-0 bg-black/50"></div>

    <div class="relative w-[420px] p-8 rounded-2xl text-white text-center
              bg-white/10 backdrop-blur-xl border border-white/20
              shadow-2xl animate-[fadeIn_0.6s_ease]">

        <!-- Title -->
        <h2 class="text-2xl font-semibold mb-5 tracking-wide">
            📤 Upload File
        </h2>

        <!-- Dropdown -->


        <!-- Input -->
        <div class="mb-5 text-left">
            <label class="text-sm text-gray-200 block mb-1">Enter Description</label>
            <input type="text"
                   [(ngModel)]="inputValue"
                   placeholder="Enter Description"
                   class="w-full px-4 py-3 rounded-xl text-white
                    bg-white/10 backdrop-blur-md border border-white/25
                    placeholder-white/60 outline-none
                    hover:bg-white/20 focus:border-blue-400
                    focus:ring-2 focus:ring-blue-300/30 transition" />
        </div>

        <div class="mb-5 text-left">
            <label class="text-sm text-gray-200 block mb-1">Enter Discount</label>
            <input type="text"
                   [(ngModel)]="discount"
                   placeholder="Enter Discount"
                   (input)="calculateFinalRate()"
                   class="w-full px-4 py-3 rounded-xl text-white
                    bg-white/10 backdrop-blur-md border border-white/25
                    placeholder-white/60 outline-none
                    hover:bg-white/20 focus:border-blue-400
                    focus:ring-2 focus:ring-blue-300/30 transition" />
        </div>


        <div class="mb-5 text-left">
            <label class="text-sm text-gray-200 block mb-1">Enter Rate</label>
            <input type="text"
                   [(ngModel)]="rate"
                   placeholder="Enter Rate"
                   (input)="calculateFinalRate()"
                   class="w-full px-4 py-3 rounded-xl text-white
                    bg-white/10 backdrop-blur-md border border-white/25
                    placeholder-white/60 outline-none
                    hover:bg-white/20 focus:border-blue-400
                    focus:ring-2 focus:ring-blue-300/30 transition" />
        </div>

        <div class="mb-5 text-left">
            <label class="text-sm text-gray-200 block mb-1">Enter Final Rate</label>
            <input type="text"
                   [(ngModel)]="finalRate"
                   placeholder="Enter FinalRate"
                   class="w-full px-4 py-3 rounded-xl text-white
                    bg-white/10 backdrop-blur-md border border-white/25
                    placeholder-white/60 outline-none
                    hover:bg-white/20 focus:border-blue-400
                    focus:ring-2 focus:ring-blue-300/30 transition" />
        </div>

        <!-- Upload Box -->
        <div class="border-2 border-dashed border-white/50 rounded-xl p-8 cursor-pointer
                transition-all duration-300 hover:border-blue-400 hover:bg-white/10
                hover:-translate-y-1"
             (click)="fileInput.click()"
             (dragover)="onDragOver($event)"
             (drop)="onDrop($event)">

            <input type="file" #fileInput hidden (change)="onFileSelected($event)" />

            <div class="text-4xl mb-2">📁</div>
            <div class="font-medium">Drag & Drop your file</div>
            <div class="text-xs text-gray-300">or click to browse</div>
        </div>

        <!-- Preview -->
        <div *ngIf="selectedFile"
             class="mt-5 p-3 rounded-lg bg-white/20 flex justify-between items-center">
            <span class="text-sm">{{ selectedFile.name }}</span>
            <span class="text-red-400 cursor-pointer text-lg hover:scale-110 transition"
                  (click)="removeFile()">✖</span>
        </div>

        <!-- Button -->
        <button
                class="mt-5 w-full py-3 rounded-xl font-semibold text-white
             bg-gradient-to-r from-pink-400 to-blue-400
             hover:scale-105 hover:shadow-xl transition
             disabled:opacity-40 disabled:cursor-not-allowed"
                [disabled]="!selectedFile"
                (click)="uploadFile()">

            🚀 Upload
        </button>

    </div>
</div>
